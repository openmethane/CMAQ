name: Build packages (reusable)

# Builds both Debian packages, tests openmethane-cmaq in a clean
# debian:trixie-slim, and uploads the packages as the artifact `debs`.
# Used by pull-request CI, the release and the dev build.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build; defaults to the calling workflow's ref
        type: string
        default: ''
      version:
        description: Debian package version; defaults to the version in pyproject.toml
        type: string
        default: ''
    outputs:
      version:
        description: The Debian version of the packages
        value: ${{ jobs.build.outputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine package version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [ -n "$VERSION" ] || VERSION="$(scripts/debian-version.sh)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Installs openmethane-cmaq into a clean debian:trixie-slim, checks every
      # ELF file with ldd and runs tests/test-all.sh. The generated Depends:
      # lines of both packages are printed in the log of this step.
      - name: Build packages and run tests
        uses: docker/build-push-action@v5
        with:
          target: test
          build-args: DEB_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false

      - name: Export packages
        uses: docker/build-push-action@v5
        with:
          target: debs
          build-args: DEB_VERSION=${{ steps.version.outputs.version }}
          outputs: type=local,dest=dist
          cache-from: type=gha

      - name: Check package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for deb in dist/*.deb; do
            echo "$deb: Version $(dpkg-deb -f "$deb" Version), Depends: $(dpkg-deb -f "$deb" Depends)"
            [ "$(dpkg-deb -f "$deb" Version)" = "$VERSION" ] || { echo "Version does not match $VERSION"; exit 1; }
          done

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb
          if-no-files-found: error
